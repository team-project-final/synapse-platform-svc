services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synapse_platform
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_local_pw
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse_platform"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "redis_local_pw"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis_local_pw ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 15
