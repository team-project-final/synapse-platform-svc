spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
  jpa:
    show-sql: false
    hibernate:
      # Flyway(V1~V32)가 스키마 소유 → Hibernate는 검증만 (base/prod와 동일)
      ddl-auto: validate
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:staging-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:staging-google-client-secret}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID:staging-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:staging-github-client-secret}
            scope: read:user,user:email

app:
  cors:
    allowed-origins: ${STAGING_FRONTEND_ORIGINS:https://staging.synapse.io}
  cookie:
    same-site: None
    secure: true
  crypto:
    aes-secret-key: ${AES_SECRET_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

synapse:
  jwt:
    # 기본값은 레포 내 dev 프로파일과 동일한 테스트 키(비-prod). 실제 staging은
    # ExternalSecret(JWT_PRIVATE_KEY/JWT_PUBLIC_KEY)으로 덮어쓴다.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    kid: ${JWT_KID:synapse-key-2026-05}
    issuer: ${JWT_ISSUER:synapse-auth}

stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_unit}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_test}
  plans:
    pro:
      price-id: ${STRIPE_PRO_PRICE_ID:price_pro_test}
    team:
      price-id: ${STRIPE_TEAM_PRICE_ID:price_team_test}
    enterprise:
      price-id: ${STRIPE_ENTERPRISE_PRICE_ID:price_enterprise_test}

logging:
  level:
    root: INFO
