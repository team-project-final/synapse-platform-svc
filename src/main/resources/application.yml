server:
  port: 8081
  forward-headers-strategy: native

spring:
  application:
    name: platform-svc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}
            scope: openid,name,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
          # TODO: Microsoft OAuth - MVP 이후 확장 Provider
          # client-id: ${MICROSOFT_CLIENT_ID}
          # client-secret: ${MICROSOFT_CLIENT_SECRET}
          # scope: openid,profile,email
          # provider: microsoft
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub
          # microsoft:
          #   authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8088}
  cookie:
    same-site: Lax
    secure: false
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}
  crypto:
    aes-secret-key: ${AES_SECRET_KEY}

stripe:
  api:
    key: ${STRIPE_API_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}
  plans:
    pro:
      price-id: ${STRIPE_PRO_PRICE_ID}
    team:
      price-id: ${STRIPE_TEAM_PRICE_ID}
    enterprise:
      price-id: ${STRIPE_ENTERPRISE_PRICE_ID}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%thread] %logger{36} - %msg%n"
