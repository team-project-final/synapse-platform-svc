server:
  port: 8081
  forward-headers-strategy: native

spring:
  application:
    name: platform-svc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}
            scope: openid,name,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
          # TODO: Microsoft OAuth - MVP 이후 확장 Provider
          # client-id: ${MICROSOFT_CLIENT_ID}
          # client-secret: ${MICROSOFT_CLIENT_SECRET}
          # scope: openid,profile,email
          # provider: microsoft
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub
          # microsoft:
          #   authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}     # compose 내부: kafka:29092
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8086}
      specific.avro.reader: true
      auto.register.schemas: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8086}   # compose 내부: http://schema-registry:8081
        auto.register.schemas: true
    consumer:
      group-id: platform-svc-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8086}
        specific.avro.reader: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  kafka:
    topics:
      user-registered: platform.auth.user-registered-v1
      notification-send: ${KAFKA_TOPIC_NOTIFICATION_SEND:platform.notification.notification-send-v1}
      note-created: ${KAFKA_TOPIC_NOTE_CREATED:knowledge.note.note-created-v1}
      note-updated: ${KAFKA_TOPIC_NOTE_UPDATED:knowledge.note.note-updated-v1}
      review-completed: ${KAFKA_TOPIC_REVIEW_COMPLETED:learning.card.review-completed-v1}
      badge-earned: ${KAFKA_TOPIC_BADGE_EARNED:engagement.gamification.badge-earned-v1}
      level-up: ${KAFKA_TOPIC_LEVEL_UP:engagement.gamification.level-up-v1}
  fcm:
    enabled: ${FCM_ENABLED:false}
    service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
    project-id: ${FCM_PROJECT_ID:}
  ses:
    enabled: ${SES_ENABLED:false}
    region: ${SES_REGION:ap-northeast-2}
    from-email: ${SES_FROM_EMAIL:noreply@synapse.app}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8088}
  cookie:
    same-site: Lax
    secure: false
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}
  crypto:
    aes-secret-key: ${AES_SECRET_KEY}

stripe:
  api:
    key: ${STRIPE_API_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}
  plans:
    pro:
      price-id: ${STRIPE_PRO_PRICE_ID}
    team:
      price-id: ${STRIPE_TEAM_PRICE_ID}
    enterprise:
      price-id: ${STRIPE_ENTERPRISE_PRICE_ID}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%thread] %logger{36} - %msg%n"
