spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: openid,email,profile
          github:
            client-id: test-github-client-id
            client-secret: test-github-client-secret
            scope: read:user,user:email
          apple:
            client-id: test-apple-client-id
            client-secret: test-apple-client-secret
            scope: openid,name,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

app:
  cors:
    allowed-origins: http://127.0.0.1:8088
  cookie:
    same-site: Lax
    secure: false
  oauth2:
    redirect-uri: http://localhost:3000/auth/callback
  crypto:
    aes-secret-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

jwt:
  private-key: 
  public-key: 
  kid: synapse-key-2026-05
  issuer: synapse-auth

stripe:
  api:
    key: sk_test_unit
  webhook:
    secret: whsec_test
  plans:
    pro:
      price-id: price_pro_test
    team:
      price-id: price_team_test
    enterprise:
      price-id: price_enterprise_test
